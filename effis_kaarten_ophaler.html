<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EFFIS kaarten — dagelijkse ophaler</title>
<style>
  :root{
    --bg:#f5f5f2; --card:#ffffff; --line:#e1ded6; --ink:#2a2a26; --sub:#7a766c;
    --accent:#3B6D11; --accent-bg:#EAF3DE; --accent-bo:#639922;
    --warn:#993C1D; --warn-bg:#FAECE7; --warn-bo:#D85A30;
    --ok-dot:#3B6D11; --err-dot:#993C1D; --checking-dot:#B8860B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink);
    padding:22px 26px 60px;
  }
  header{
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px;
    border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:14px;
  }
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:var(--sub); font-size:13px;}
  .meta{font-size:12px; color:var(--sub); text-align:right;}

  .statusbar{
    display:flex; align-items:center; gap:10px; font-size:12.5px;
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; margin-bottom:16px;
  }
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--checking-dot);}
  .dot.ok{background:var(--ok-dot);}
  .dot.err{background:var(--err-dot);}
  .statusbar .label{font-weight:600;}
  .statusbar .detail{color:var(--sub);}
  .statusbar button{
    margin-left:auto; font-size:11.5px; padding:4px 10px; border-radius:6px;
    border:1px solid var(--accent-bo); background:var(--accent-bg); color:var(--accent);
    cursor:pointer; font-weight:600;
  }

  .controls{
    display:flex; gap:18px; flex-wrap:wrap; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; margin-bottom:20px; font-size:13px;
  }
  .controls label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .controls select, .controls input[type=text]{
    font-size:13px; padding:4px 6px; border:1px solid var(--line); border-radius:6px;
  }
  .seg{display:flex; border:1px solid var(--accent-bo); border-radius:7px; overflow:hidden;}
  .seg button{
    border:none; border-radius:0; background:#fff; color:var(--ink); font-weight:500;
    padding:6px 12px;
  }
  .seg button.active{background:var(--accent-bg); color:var(--accent); font-weight:700;}
  button{
    font-size:13px; padding:7px 14px; border-radius:7px; border:1px solid var(--accent-bo);
    background:var(--accent-bg); color:var(--accent); cursor:pointer; font-weight:600;
  }
  button:hover{filter:brightness(0.97);}

  .grid{
    display:grid;
    grid-template-columns: 118px repeat(4, 1fr);
    gap:10px;
  }
  .corner{}
  .daycol-head{
    text-align:center; font-weight:700; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:8px 4px; font-size:13px;
  }
  .daycol-head .date{display:block; font-weight:400; color:var(--sub); font-size:11.5px; margin-top:2px;}
  .rowlabel{
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    font-weight:700; font-size:13px; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:6px;
  }
  .rowlabel .full{display:block; font-weight:400; color:var(--sub); font-size:10px; margin-top:2px;}

  .cell{
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .imgwrap{
    width:100%; aspect-ratio:4/3.4; position:relative;
    background:
      linear-gradient(45deg,#f0f0ec 25%,transparent 25%,transparent 75%,#f0f0ec 75%),
      linear-gradient(45deg,#f0f0ec 25%,transparent 25%,transparent 75%,#f0f0ec 75%);
    background-size:16px 16px; background-position:0 0,8px 8px;
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
  }
  .imgwrap canvas{width:100%; height:100%; display:block;}
  .status{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--sub); text-align:center; padding:6px; background:rgba(255,255,255,0.85);
  }
  .status.err{color:var(--warn);}
  .hint{font-size:10.5px; color:var(--sub); text-align:center;}
  .retry{font-size:11px; padding:3px 8px; border-radius:5px;}

  footer{
    margin-top:28px; font-size:11.5px; color:var(--sub); border-top:1px solid var(--line);
    padding-top:12px; line-height:1.6;
  }
  footer a{color:var(--sub);}
  code{background:#eee; padding:1px 4px; border-radius:4px; font-size:11px;}

  @media print{ .controls, .retry, .statusbar{display:none;} }
</style>
</head>
<body>

<header>
  <div>
    <h1>EFFIS kaarten — dag+1 t/m dag+4</h1>
    <div class="sub">FWI · FFMC · DC · ISI · BUI · DMC — zelfde bron/stijl als de EFFIS Current Situation Viewer</div>
  </div>
  <div class="meta" id="genInfo"></div>
</header>

<div class="statusbar">
  <span class="dot" id="statusDot"></span>
  <span class="label" id="statusLabel">EFFIS-server controleren…</span>
  <span class="detail" id="statusDetail"></span>
  <button onclick="checkEffisStatus()">↻ Status vernieuwen</button>
</div>

<div class="controls">
  <label>
    Databron:
    <select id="model">
      <option value="ecmwf">ECMWF (~8 km)</option>
      <option value="mf010">Météo-France (~10 km)</option>
    </select>
  </label>
  <label title="minLon,minLat,maxLon,maxLat in EPSG:4326">
    Uitsnede (BBOX):
    <input type="text" id="bbox" value="2.9,50.5,7.4,53.7" size="22">
  </label>
  <div>
    Achtergrond:
    <span class="seg">
      <button id="bg-transparent" class="active" onclick="setBackground('transparent')">Transparant</button><button id="bg-map" onclick="setBackground('map')">EFFIS-kaart</button>
    </span>
  </div>
  <label><input type="checkbox" id="showBorders" checked onchange="renderAll()"> Landsgrenzen</label>
  <button onclick="renderAll()">↻ Alles (opnieuw) laden</button>
  <span class="hint" style="max-width:260px;">Rechtermuisknop op een kaart → "Afbeelding kopiëren" → plakken in je analyse.</span>
</div>

<div class="grid" id="grid"></div>

<footer id="footerInfo"></footer>

let backgroundMode = 'transparent';

function setBackground(mode){
  backgroundMode = mode;
  document.getElementById('bg-transparent').classList.toggle('active', mode==='transparent');
  document.getElementById('bg-map').classList.toggle('active', mode==='map');
  renderAll();
}

function fmtISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtNL(d){
  const dgn=['zo','ma','di','wo','do','vr','za'];
  return `${dgn[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getDays(){
  const days=[]; const today = new Date();
  for(let i=1;i<=4;i++){ const d = new Date(today); d.setDate(d.getDate()+i); days.push(d); }
  return days;
}

function xFrac(lon, n){ return (lon+180)/360*n; }
function yFrac(lat, n){
  const r = lat*Math.PI/180;
  return (1 - Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n;
}

function indexTileUrl(layer, tx, ty, timeISO){
  const p = new URLSearchParams({
    layer, tilematrixset:'ECMWF3857', Service:'WMTS', Request:'GetTile',
    Version:'1.0.0', Format:'image/png', TileMatrix:String(ZOOM),
    TileCol:String(tx), TileRow:String(ty), time:timeISO
  });
  return WMTS_BASE + '?' + p.toString();
}
function basemapTileUrl(tx, ty){
  return `${BASEMAP_BASE}/${BASEMAP_ZOOM}/${ty}/${tx}.jpg`;
}

// ---------- Statuscontrole EFFIS-server ----------
async function checkEffisStatus(){
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  const detail = document.getElementById('statusDetail');
  dot.className = 'dot';
  label.textContent = 'EFFIS-server controleren…';
  detail.textContent = '';

  const testUrl = indexTileUrl('ecmwf.fwi', 32, 21, fmtISO(getDays()[0])) + '&_ping=' + Date.now();
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 8000);
  const t0 = performance.now();
  try{
    const resp = await fetch(testUrl, {mode:'cors', signal:controller.signal, cache:'no-store'});
    clearTimeout(timeout);
    const ms = Math.round(performance.now()-t0);
    if(resp.ok){
      dot.className = 'dot ok';
      label.textContent = 'EFFIS-server bereikbaar';
      detail.textContent = `(${ms} ms, gecontroleerd om ${new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'})})`;
    } else {
      dot.className = 'dot err';
      label.textContent = `EFFIS-server geeft een foutmelding (HTTP ${resp.status})`;
      detail.textContent = 'Waarschijnlijk tijdelijk overbelast — probeer het later opnieuw.';
    }
  }catch(e){
    clearTimeout(timeout);
    dot.className = 'dot err';
    label.textContent = 'EFFIS-server niet bereikbaar';
    detail.textContent = 'Kon geen verbinding maken binnen 8 seconden — server is waarschijnlijk (tijdelijk) uit de lucht.';
  }
}

function loadImg(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('tile failed: '+url));
    img.src = url;
  });
}

async function stitchLayer(bboxStr, zoom, tilePx, urlFn){
  const [minLon,minLat,maxLon,maxLat] = bboxStr.split(',').map(Number);
  const n = Math.pow(2, zoom);
  const xMinF = xFrac(minLon, n), xMaxF = xFrac(maxLon, n);
  const yMinF = yFrac(maxLat, n), yMaxF = yFrac(minLat, n);

  const txStart = Math.floor(xMinF), txEnd = Math.floor(xMaxF) + 1;
  const tyStart = Math.floor(yMinF), tyEnd = Math.floor(yMaxF) + 1;

  const stitched = document.createElement('canvas');
  stitched.width = (txEnd-txStart) * tilePx;
  stitched.height = (tyEnd-tyStart) * tilePx;
  const sctx = stitched.getContext('2d');

  const jobs = [];
  for(let tx=txStart; tx<txEnd; tx++){
    for(let ty=tyStart; ty<tyEnd; ty++){
      jobs.push(
        loadImg(urlFn(tx,ty)).then(img=>{
          sctx.drawImage(img, (tx-txStart)*tilePx, (ty-tyStart)*tilePx);
        }).catch(()=>{})
      );
    }
  }
  await Promise.all(jobs);

  const sx = (xMinF-txStart)*tilePx, sy=(yMinF-tyStart)*tilePx;
  const sw = (xMaxF-xMinF)*tilePx,  sh=(yMaxF-yMinF)*tilePx;
  return {canvas: stitched, sx, sy, sw, sh};
}

function projectToCanvas(lon, lat, minLon, minLat, maxLon, maxLat, outW, outH){
  const n = 1;
  const xMinF = xFrac(minLon,n), xMaxF = xFrac(maxLon,n);
  const yMinF = yFrac(maxLat,n), yMaxF = yFrac(minLat,n);
  const px = (xFrac(lon,n)-xMinF)/(xMaxF-xMinF)*outW;
  const py = (yFrac(lat,n)-yMinF)/(yMaxF-yMinF)*outH;
  return [px, py];
}

function drawBorders(ctx, bboxStr, outW, outH){
  const [minLon,minLat,maxLon,maxLat] = bboxStr.split(',').map(Number);
  const rings = [];
  Object.values(BORDERS).forEach(polys=>{
    polys.forEach(ring=>{
      rings.push(ring.map(([lon,lat])=>projectToCanvas(lon,lat,minLon,minLat,maxLon,maxLat,outW,outH)));
    });
  });

  function strokeAll(width, style){
    ctx.lineWidth = width;
    ctx.strokeStyle = style;
    ctx.lineJoin = 'round';
    rings.forEach(pts=>{
      ctx.beginPath();
      pts.forEach(([x,y],i)=> i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
      ctx.stroke();
    });
  }
  strokeAll(3, 'rgba(255,255,255,0.85)');
  strokeAll(1.2, 'rgba(35,35,35,0.9)');
}

async function buildCanvas(layer, timeISO, bboxStr, outW, withBasemap, withBorders){
  const overlay = await stitchLayer(bboxStr, ZOOM, TILE_PX, (tx,ty)=>indexTileUrl(layer, tx, ty, timeISO));
  const outH = Math.round(outW * (overlay.sh/overlay.sw));

  const final = document.createElement('canvas');
  final.width = outW; final.height = outH;
  const fctx = final.getContext('2d');

  if(withBasemap){
    const base = await stitchLayer(bboxStr, BASEMAP_ZOOM, BASEMAP_TILE_PX, (tx,ty)=>basemapTileUrl(tx,ty));
    fctx.drawImage(base.canvas, base.sx, base.sy, base.sw, base.sh, 0, 0, outW, outH);
  }
  fctx.drawImage(overlay.canvas, overlay.sx, overlay.sy, overlay.sw, overlay.sh, 0, 0, outW, outH);

  if(withBorders){
    drawBorders(fctx, bboxStr, outW, outH);
  }
  return final;
}

function cellId(idxKey, dayIdx){ return `cell_${idxKey}_${dayIdx}`; }

async function runQueue(tasks, limit){
  let i = 0;
  async function worker(){
    while(i < tasks.length){
      const idx = i++;
      await tasks[idx]();
    }
  }
  await Promise.all(Array.from({length:limit}, worker));
}

function renderAll(){
  const days = getDays();
  const bbox = document.getElementById('bbox').value.trim();
  const model = document.getElementById('model').value;
  const withBasemap = backgroundMode === 'map';
  const withBorders = document.getElementById('showBorders').checked;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const corner = document.createElement('div');
  corner.className = 'corner';
  grid.appendChild(corner);

  days.forEach((d,i)=>{
    const h = document.createElement('div');
    h.className = 'daycol-head';
    h.innerHTML = `Dag +${i+1}<span class="date">${fmtNL(d)}</span>`;
    grid.appendChild(h);
  });

  const tasks = [];

  INDEXES.forEach(idx=>{
    const rl = document.createElement('div');
    rl.className = 'rowlabel';
    rl.innerHTML = `${idx.label}<span class="full">${idx.full}</span>`;
    grid.appendChild(rl);

    days.forEach((d, dayIdx)=>{
      const cell = document.createElement('div');
      cell.className = 'cell';
      const timeISO = fmtISO(d);
      const layer = `${model}.${idx.key}`;

      const wrap = document.createElement('div');
      wrap.className = 'imgwrap';
      wrap.id = cellId(idx.key, dayIdx);
      wrap.innerHTML = '<div class="status">Wachten…</div>';
      cell.appendChild(wrap);

      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = `${idx.label} · ${timeISO}`;
      cell.appendChild(hint);

      grid.appendChild(cell);

      tasks.push(()=>loadCell(wrap, layer, timeISO, bbox, idx.key, dayIdx, withBasemap, withBorders));
    });
  });

  document.getElementById('genInfo').textContent =
    `Gegenereerd: ${fmtNL(new Date())} ${new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}`;

  document.getElementById('footerInfo').innerHTML = `
    Bron: EFFIS / Copernicus Emergency Management Service — WMTS-tegelservice (dezelfde bron als de
    <a href="https://forest-fire.emergency.copernicus.eu/apps/effis.csv/" target="_blank">Current Situation Viewer</a>).
    Endpoint: <code>${WMTS_BASE}</code>, tilematrixset <code>ECMWF3857</code>, TileMatrix ${ZOOM}.
    Lagen: ${INDEXES.map(i=>model+'.'+i.key).join(', ')}.
    Uitsnede (EPSG:4326): <code>${bbox}</code>.
    ${withBasemap ? 'Achtergrondkaart: © EOX IT Services GmbH — Sentinel-2 cloudless (bevat gewijzigde Copernicus Sentinel-data), via <code>tiles.maps.eox.at</code>.' : 'Zeegebied/geen-data blijft transparant.'}
    ${withBorders ? 'Landsgrenzen: vereenvoudigd, o.b.v. GISCO CNTR_RG_20M_2020_4326 (Eurostat/Europese Commissie), zelfde brondata als de EFFIS-viewer.' : ''}
    Documentatie: <a href="https://forest-fire.emergency.copernicus.eu/downloads-instructions" target="_blank">downloads-instructions</a> ·
    <a href="https://forest-fire.emergency.copernicus.eu/about-effis/data-license" target="_blank">datalicentie</a>.
  `;

  runQueue(tasks, 4);
}

async function loadCell(wrap, layer, timeISO, bbox, idxKey, dayIdx, withBasemap, withBorders){
  wrap.innerHTML = '<div class="status">Laden…</div>';
  try{
    const canvas = await buildCanvas(layer, timeISO, bbox, 640, withBasemap, withBorders);
    wrap.innerHTML = '';
    wrap.appendChild(canvas);
  }catch(e){
    wrap.innerHTML = `<div class="status err">Kon kaart niet laden.<br>Server kan druk zijn.<br>
      <button class="retry" onclick="retryCell('${layer}','${timeISO}','${idxKey}',${dayIdx})">↻ Opnieuw</button></div>`;
  }
}

function retryCell(layer, timeISO, idxKey, dayIdx){
  const bbox = document.getElementById('bbox').value.trim();
  const withBasemap = backgroundMode === 'map';
  const withBorders = document.getElementById('showBorders').checked;
  const wrap = document.getElementById(cellId(idxKey, dayIdx));
  loadCell(wrap, layer, timeISO, bbox, idxKey, dayIdx, withBasemap, withBorders);
}

document.getElementById('model').addEventListener('change', renderAll);
checkEffisStatus();
renderAll();
</script>
